name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-preview-build.yml'
      - 'scripts/hydrate-fern-versions.sh'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          printf '%s' '--log-level=Published docs to a=b (' > preview-metadata/head_ref
          echo "docs/welcome.md" > preview-metadata/changed_md_files

      - name: Upload fern sources and metadata
        uses: actions/upload-artifact@v7
        with:
          name: fern-preview
          include-hidden-files: true
          retention-days: 1
          path: |
            fern/
            preview-metadata/
            urllib/
